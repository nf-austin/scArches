name: models
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - setuptools<82
  - pip:
      # numpy<2: scArches holds pandas at 1.5.3, built against the numpy 1.x ABI.
      - numpy<2
      # scArches drives the scanpy / anndata / scvi-tools versions. Pinning
      # anndata to 0.9.2 (as this file used to) makes the set unsolvable with
      # this commit, which needs scvi-tools new enough to export SysVI.
      - git+https://github.com/theislab/scarches.git@d35cde61fff4dec6b86660817f4750fa35ff836d
      - matplotlib
      - scikit-learn
